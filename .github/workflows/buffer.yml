name: Enviar a Buffer
on:
  push:
    branches: [main]
    paths: ["posts/**/post.json"]
  workflow_dispatch:
    inputs:
      post:
        description: "Ruta de un post.json para reenviarlo (posts/2026-10-27-xxx/post.json)"
        required: true

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Buscar posts nuevos
        id: posts
        run: |
          if [ -n "${{ github.event.inputs.post }}" ]; then
            echo "list=${{ github.event.inputs.post }}" >> "$GITHUB_OUTPUT"
          else
            BEFORE="${{ github.event.before }}"
            git cat-file -e "$BEFORE" 2>/dev/null || BEFORE=$(git hash-object -t tree /dev/null)
            echo "list=$(git diff --name-only --diff-filter=AM "$BEFORE" "${{ github.sha }}" -- 'posts/**/post.json' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi
      - name: Crear borradores en Buffer
        if: steps.posts.outputs.list != ''
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          IMAGE_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/
        run: python3 scripts/send_to_buffer.py ${{ steps.posts.outputs.list }}
